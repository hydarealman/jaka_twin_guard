# Perception Parameters — Camera abstraction & object detection

# Camera type: "mock" | "gazebo" | "realsense"
camera_type: "realsense"             # fail-safe default; simulation launch overrides explicitly

# Camera frame in TF tree. Gazebo depth is aligned to the colour optical frame.
camera_frame: "camera_color_optical_frame"

# Downstream coordinate contract. Architecture A publishes real targets in
# world; the current URDF has world -> base_link = identity, so their numeric
# coordinates are presently equal while the frame ownership stays explicit.
output_frame: "world"               # 最终水果坐标系
drop_on_transform_failure: true     # 如果TF无法将检测结果变换到output_frame,直接丢弃,避免抓取到错误位置
force_table_center_z: false         # 仅 mock/Gazebo launch 可显式启用
enable_table_z_fallback: false      # 实车 RANSAC 失败时丢弃该帧，不猜测桌高

# RealSense production path: 2-D semantic detection + registered depth.
# Simulation launches override this to geometry because they do not provide a
# color-aligned depth image or an Ultralytics model.
localizer_backend: "geometry"
rgbd_sync_tolerance_s: 0.033

# ── Real D455 tabletop perception ──
# These parameters are used only when enable_table_perception=true. Coordinates
# in world_roi_* are metres in world/base_link, not camera coordinates. The ROI
# below surrounds the currently measured real tabletop with margin and prevents
# the floor or another horizontal surface from being selected as the table.
table_perception:
  stride: 6                     # sample every 6th RGB-aligned depth pixel
  min_depth_m: 0.20             # valid D455 optical-depth range
  max_depth_m: 1.50
  # Survey migrated to the base-bottom centre with J1=0 along public +X.
  # The perceived tabletop is now in front of the robot around +X.
  world_roi_min: [-0.03, -0.41, -0.11]
  world_roi_max: [0.97, 0.89, 0.14]
  histogram_bin_m: 0.010        # dominant horizontal height layer: 10 mm bins
  plane_tolerance_m: 0.015      # points within 15 mm can support the plane
  max_tilt_deg: 5.0             # current table measured about 0.9 degrees
  max_residual_std_m: 0.008     # reject rough/non-planar surfaces over 8 mm RMS
  min_inliers: 180
  min_inlier_fraction: 0.12
  min_extent_m: 0.15            # reject small flat objects as a table
  history_size: 7
  min_stable_frames: 5
  max_temporal_std_m: 0.006     # accepted height must vary less than 6 mm

# Output topics (standardized, independent of camera type)
point_cloud_topic: "/perception/point_cloud"
depth_image_topic: "/perception/depth_image"
rgb_image_topic: "/perception/rgb_image"

# ── Object Detection Parameters ──

# Voxel grid leaf size for downsampling (m)
# 点云降采样 边长 减少点云密度 加速后续处理
voxel_leaf_size: 0.005

# RANSAC plane segmentation
# 桌面平面分割
ransac_distance_threshold: 0.008   # tighter for better plane fit # RANSAC判断点术语桌面的距离阈值,越小平面拟合越精确
ransac_max_iterations: 200         # more iterations = better plane model # 最大迭代次数,200次能稳定找到桌面平面

# Euclidean cluster extraction
# 水果点云聚类距离
cluster_tolerance: 0.015           # tighter to separate close objects (was 0.02)
# 水果尺寸过滤
min_cluster_size: 50               # lower to catch small fruits (was 100)
max_cluster_size: 5000             # per-cluster cap (was 10000)

# Legacy point-cloud/mock geometry backend only. The real Architecture-A task
# does NOT use this 0.30 m value: it requires the fresh, temporally stable D455
# table_perception result above and fails closed if that result is unavailable.
table_top_z: 0.30
table_z_tolerance: 0.02

# Minimum confidence for a detection (0.0–1.0)
min_confidence: 0.5    # 目标检测的最小置信度阈值

# Crop in the configured output frame. Architecture A real launch overrides
# this legacy/default box with its surveyed world/base-equivalent limits;
# Architecture B uses base_link. Re-measure after changing either frame.
# 允许检测的三维工作空间
detection_roi_min: [0.36, -0.38, 0.27]
detection_roi_max: [1.05, 0.38, 0.55]

# Fruit-size gate after clustering. Scene structures and robot links are not
# valid fruit even if their point clouds form a cluster.
min_object_radius: 0.015
max_object_radius: 0.050

# ── Mock Camera Parameters ──
# 模拟相机按照设定频率生成带有高斯噪声的假点云,方便无硬件调试
mock_camera:
  publish_rate: 10.0
  table_points: 2000
  points_per_object: 400
  noise_std: 0.003   # 3mm Gaussian noise
  camera_z: 0.86     # height of camera above ground

# ── Gazebo Camera Parameters ──
# Gazebo 和 RealSense 分别指定自己的原始话题，使感知模块能接收仿真或真实数据。两者接口一致，切换时只需更改 camera_type
gazebo_camera:
  # Same public contract as the RealSense ROS 2 driver.
  depth_topic: "/camera/camera/depth/color/points"
  depth_image_topic: "/camera/camera/depth/image_rect_raw"
  color_image_topic: "/camera/camera/color/image_raw"

# ── RealSense Camera Parameters ──
realsense_camera:
  depth_topic: "/camera/camera/depth/color/points"
  depth_image_topic: "/camera/camera/depth/image_rect_raw"
  color_image_topic: "/camera/camera/color/image_raw"
  camera_info_topic: "/camera/camera/depth/camera_info"
  aligned_depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"
  color_camera_info_topic: "/camera/camera/color/camera_info"
  # Build a compact XYZ cloud from the real Z16 depth image.  This avoids
  # transporting the driver's very large textured cloud over WSL/USB-IP.
  generate_point_cloud: true
  point_cloud_downsample: 2

fruit_detector:
  model: "yolov8n.pt"
  # Tiled inference preserves enough pixels for the moved apple to score well
  # above the old full-frame value. Keep a meaningful raw proposal floor;
  # registered-depth, radius, ROI, health-confidence and temporal gates still
  # decide whether a 3-D target can be published.
  confidence: 0.25
  # Hysteresis: this lower proposal floor can only continue a spatially
  # associated existing apple. It can never acquire a new target.
  tracking_confidence: 0.12
  iou: 0.50
  image_size: 640
  # Keep several apples from the same frame.  The downstream tracker assigns
  # an independent ID to each one; the task bridge picks one at a time while
  # all remaining apples stay in MoveIt's PlanningScene as collision spheres.
  max_detections: 5
  # Keep PyTorch from consuming every WSL CPU core and starving RealSense/DDS.
  inference_threads: 1
  # The D455-adapted v2 model is trained on full 424x240 frames. Local crops
  # shift its input distribution and were measured less reliable than the
  # full frame, so use shifted full-scale edge recovery instead.
  small_object_tiles: false
  tile_rows: 2
  tile_cols: 2
  tile_overlap: 0.25
  # Once a fruit is found, a tighter local crop keeps it large in the model
  # input. If it moves outside this crop for two frames, grid search resumes.
  local_tile_width_ratio: 0.40
  local_tile_height_ratio: 0.50
  max_local_tile_misses: 2
  # When normal search misses, batch shifted full-scale views on the GPU.
  # Reflection padding supplies context for complete fruit near image edges.
  edge_recovery: true
  edge_shift_ratio: 0.18
  # Prefer the NVIDIA GPU when WSL exposes CUDA; remain runnable on CPU-only
  # development machines without changing this configuration.
  device: "auto"
  fast_annotated_topic: "/perception/detection_annotated"
  fast_detections_topic: "/perception/apple_detections_2d"
  # Debug/association continuity only. Predicted 2-D boxes never enter depth,
  # health classification or the grasp target topic.
  display_track_confirm_hits: 2
  display_track_max_misses: 2
  display_track_max_age_s: 0.18
  display_track_max_center_motion_ratio: 0.35
  min_depth_m: 0.10
  max_depth_m: 5.0
  min_depth_coverage: 0.20

# ── 水果种类/好坏识别（点云定位 + ROI MobileNetV3 分类）──
# 好坏识别参数
classifier:
  license_mode: "development"       # real launch overrides production
  model_license_approved: false
  enabled: true                     # 开启质量检查,关闭时只输出位置,不判断好坏
  quality_model: ""                 # empty: installed fruit_quality_mobilenet_v3.onnx # 指定的ONNX模型
  required_fruit_type: "apple"      # current delivery accepts apples only
  camera_info_topic: "/camera/camera/color/camera_info"    # 相机内参话题,用于将3D点云投影到2D图像上裁剪ROI
  annotated_topic: "/perception/health_annotated"
  roi_scale: 1.25                   # crop half-size = projected radius * roi_scale # 在投影半径的基础上放大1.25倍截取取图像块,确保水果完整包含在内
  min_roi_pixels: 24                # 424p D455 apples are ~25-30 px; classifier still resizes to 224, while smaller crops remain rejected
  min_visible_ratio: 0.90           # reject crops cut by the image edge # 水果投影矩阵必须至少有90%在图像内,否则边缘截断会影响分类,丢弃该检测
  max_sync_delta: 0.033             # RGB image vs aligned depth timestamp (s)
  min_health_confidence: 0.65       # reject weak quality classifications
  min_health_margin: 0.25           # reject ambiguous top-2 classes

  # 仿真中允许直接给所有物体一个固定的健康置信度,方便调试规划,而不经过实际分类网络
  # Fail-safe default. Mock/Gazebo launch files explicitly override this to true.
  # HealthFusion also forcibly rejects fallback for a RealSense camera.
  allow_scene_fallback: false
  sim_fallback_confidence: 1.0
