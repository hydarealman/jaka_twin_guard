kinematic_calibrator:
  ros__parameters:
    image_topic: "/camera/camera/color/image_raw"
    camera_info_topic: "/camera/camera/color/camera_info"
    joint_state_topic: "/joint_states"
    annotated_topic: "/kinematic_calibration/annotated"
    camera_frame: "camera_color_optical_frame"
    camera_root_frame: "camera_link"
    joint_names: ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6"]

    # A metric, flat chessboard rigidly mounted to tool_flange.
    target_type: "chessboard"
    chessboard_corners_x: 9
    chessboard_corners_y: 6
    square_length_m: 0.030
    # Used only if target_type is changed to charuco.
    dictionary: "DICT_5X5_250"
    charuco_squares_x: 7
    charuco_squares_y: 5
    marker_length_m: 0.022
    min_detected_corners: 8

    max_reprojection_error_px: 1.5
    max_sample_age_s: 0.75
    max_sync_delta_s: 0.08
    stationary_velocity_rad_s: 0.01
    duplicate_joint_distance_rad: 0.05

    # Every fourth capture is held out, so 40 captures become 30 fit + 10 validation.
    minimum_training_samples: 30
    minimum_validation_samples: 10
    translation_sigma_m: 0.003
    rotation_sigma_rad: 0.008726646259971648
    robust_loss_scale: 2.0
    maximum_joint_offset_rad: 0.15
    maximum_link_correction_m: 0.03
    minimum_joint_span_rad: 0.15
    maximum_condition_number: 1.0e10
    validation_position_p95_m: 0.005
    validation_rotation_p95_deg: 1.0
