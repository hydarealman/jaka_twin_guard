# Skill Parameters — Atomic manipulation skill configuration

# ── Detect Objects ──
detect_objects:
  timeout: 5.0          # max wait for detection
  min_objects: 1        # minimum number of objects to proceed
  data_wait_timeout: 15.0  # wait for first point cloud (Gazebo startup)

# ── Approach ──
approach:
  strategy: "top_down"
  top_down_yaw: 3.141592654 # preferred wrist rotation; +Z(TCP) remains world-down
  finger_tip_beyond_tcp: 0.037  # CAD: fingers reach ~36 mm beyond the 124 mm TCP
  clearance_above_fruit: 0.050  # finger tips stay 50 mm above fruit top at hover
  cartesian: true           # use Cartesian path for approach
  planning_time: 5.0

# ── Grasp ──
grasp:
  strategy: "top_down"
  top_down_yaw: 3.141592654
  cartesian: true           # use Cartesian path for descent
  planning_time: 5.0
  # Gripper control
  close_time: 1.0           # time to close gripper (seconds)
  close_velocity: 0.02      # m/s for prismatic joints

# ── Lift ──
lift:
  strategy: "top_down"
  top_down_yaw: 3.141592654
  height: 0.15              # vertical lift distance (m)
  cartesian: true
  planning_time: 5.0

# ── Place ──
place:
  strategy: "top_down"
  top_down_yaw: 3.141592654
  approach_height: 0.12     # hover height above bin (m)
  release_clearance: 0.015  # fruit bottom height above bin rim before release
  drop_wall_clearance: 0.010 # extra radial clearance from every bin wall
  release_delay: 0.8        # seconds to hold before releasing
  retract_distance: 0.10    # retract height after release (m)
  # Crossing the workcell to a bin must use the global collision-aware
  # planner.  Only the short vertical drop/retract segments are Cartesian.
  cartesian: false
  planning_time: 8.0

# ── Retreat ──
retreat:
  standoff_distance: 0.12
  cartesian: true
  planning_time: 5.0
