# Scene Parameters — Table, bin, and object definitions
# All dimensions in meters, world frame.

world_frame: "world"

# ── Table ──
table:
  center: {x: 0.70, y: 0.0}
  top_z: 0.30
  size: {x: 0.75, y: 0.70, z: 0.04}
  leg_size: 0.04
  leg_height: 0.26   # top_z - size.z

# ── Bins（好坏分拣：两个料框）──
# healthy  : 好苹果料框
# unhealthy: 坏苹果料框（镜像到 y 负侧，工作域内可达）
bins:
  healthy:
    center: {x: 0.55, y: 0.45}
    top_z: 0.30
    size: {x: 0.20, y: 0.20, z: 0.15}
    wall_thickness: 0.01
  unhealthy:
    center: {x: 0.55, y: -0.45}
    top_z: 0.30
    size: {x: 0.20, y: 0.20, z: 0.15}
    wall_thickness: 0.01

# 向后兼容别名：单 bin = healthy 料框
bin:
  center: {x: 0.55, y: 0.45}
  top_z: 0.30
  size: {x: 0.20, y: 0.20, z: 0.15}
  wall_thickness: 0.01

# ── Objects (苹果) ──
# 场景全部为苹果；仿真可用这些标签作为质量分类兜底。
# 每个对象：
#   id          — 唯一碰撞体 ID（与 Gazebo world 中模型名一致，用于贴图）
#   shape       — "sphere"
#   position    — {x, y} 桌面位置 (z = table_top_z + radius)
#   radius      — 球半径
#   color       — [r, g, b, a] RViz 可视化
#   label       — 人类可读名
#   health      — 仅供 mock/Gazebo 仿真使用；实车分类失败必须保持 Unknown
objects:
  - id: "fruit_apple_1"
    shape: "sphere"
    position: {x: 0.50, y: -0.20}
    radius: 0.035
    color: [0.85, 0.15, 0.12, 0.9]
    label: "Apple-1"
    health: "Healthy"

  - id: "fruit_apple_2"
    shape: "sphere"
    position: {x: 0.55, y: -0.05}
    radius: 0.040
    color: [0.45, 0.30, 0.12, 0.9]
    label: "Apple-2"
    health: "Unhealthy"

  - id: "fruit_apple_3"
    shape: "sphere"
    # Kept outside the CAD arm's inner singular/narrow-passage region.
    position: {x: 0.65, y: 0.15}
    radius: 0.030
    color: [0.85, 0.15, 0.12, 0.9]
    label: "Apple-3"
    health: "Healthy"

  - id: "fruit_apple_4"
    shape: "sphere"
    position: {x: 0.72, y: -0.20}
    radius: 0.028
    color: [0.45, 0.30, 0.12, 0.9]
    label: "Apple-4"
    health: "Unhealthy"

# ── Home pose (joint angles in radians) ──
# Collision-free ready pose for the CAD-derived arm.  The CAD all-zero pose
# intersects the work table and must never be used as a planning start state.
home_pose: [0.0, 0.0, 1.0, 0.0, -1.0, 0.0]
