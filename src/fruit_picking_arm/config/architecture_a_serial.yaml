serial_trajectory_controller:
  ros__parameters:
    serial_port: "/dev/ttyUSB0"    # Windows example: COM3
    baudrate: 115200
    ack_timeout: 0.25
    retries: 3
    heartbeat_rate: 10.0
    robot_state_timeout_s: 0.5
    action_name: "/arm_controller/follow_joint_trajectory"
    gripper_action_name: "/gripper_controller/gripper_cmd"
    joint_state_topic: "/joint_states"
    # UInt8MultiArray data=[state, verified]. State: UNKNOWN=0, OPENING=1,
    # OPEN=2, CLOSING=3, CLOSED=4, FAULT=5. verified remains 0 without sensors.
    gripper_state_topic: "/gripper/state_estimate"
    require_ready: true
    # Real hardware arm trajectories contain only these six rotary axes.
    arm_joint_names:
      ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6"]
    arm_lower_limits:
      [-2.007128639, 0.087266463, -3.054326191,
       -2.792526803, -1.483529864, -3.054326191]
    arm_upper_limits:
      [2.007128639, 2.443460952, -0.087266463,
       2.792526803, 1.483529864, 3.054326191]
    # Feedback is observable throughout the URDF hard range even when it is
    # outside the narrower MoveIt command range. Motion remains blocked until
    # feedback returns inside arm_lower_limits/arm_upper_limits.
    arm_feedback_lower_limits:
      [-2.094395102, 0.0, -3.141592654,
       -2.879793266, -1.570796327, -3.141592654]
    arm_feedback_upper_limits:
      [2.094395102, 2.530727415, 0.0,
       2.879793266, 1.570796327, 3.141592654]
    # Encoder quantization/calibration allowance at a physical hard boundary.
    feedback_limit_tolerance: 0.02
    # Coordinated production envelope. Planned peaks at 30% are
    # [0.42, 0.471, 0.471, 0.471, 0.471, 0.471] rad/s. J1 keeps 0.01 rad/s
    # validation headroom while remaining below the firmware's 0.435 rad/s
    # joint-side hard clamp; the other axes retain their existing hard gates.
    arm_max_velocities: [0.43, 0.49, 0.49, 1.29, 1.50, 1.50]
    arm_max_accelerations: [0.75, 0.75, 0.75, 0.75, 0.75, 0.75]
    # Ignore MoveIt/RViz re-execution plans that never leave the current
    # encoder neighbourhood. Sending these 0-0.1 s trajectories to the board
    # only makes a stationary arm hunt the same endpoint again.
    no_op_position_tolerance_rad: 0.0025
    no_op_velocity_tolerance_rad_s: 0.01

    # The physical gripper is binary. MoveIt uses a separate GripperCommand
    # action and may request only 0.000 m CLOSED or 0.056 m OPEN.
    gripper_joint_names: ["left_finger_joint", "right_finger_joint"]
    gripper_lower_limits: [0.0, -0.056]
    gripper_upper_limits: [0.056, 0.0]
    # ROBOT_STATE currently contains no measured gripper position.  Publish a
    # clearly-labelled closed endpoint estimate at startup so
    # robot_state_publisher can keep every gripper mesh attached.  This matches
    # the fail-closed mechanism (no actuation current -> closed). Successful
    # open/close commands update the binary estimate; J1-J6 remain real feedback.
    unmeasured_gripper_initial_positions: [0.0, 0.0]
    gripper_endpoint_tolerance_m: 0.002
