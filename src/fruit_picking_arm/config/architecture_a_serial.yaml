serial_trajectory_controller:
  ros__parameters:
    serial_port: "/dev/ttyUSB0"    # Windows example: COM3
    baudrate: 115200
    ack_timeout: 0.25
    retries: 3
    heartbeat_rate: 10.0
    robot_state_timeout_s: 0.5
    action_name: "/arm_controller/follow_joint_trajectory"
    joint_state_topic: "/joint_states"
    require_ready: true
    # MoveIt may still submit all eight simulation joints. The C++ serial
    # controller extracts only these six rotary axes for TRAJECTORY_POINT.
    arm_joint_names:
      ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6"]
    arm_lower_limits:
      [-2.792526803, -0.959931089, -1.483529864,
       -2.879793266, -1.483529864, -2.705260341]
    arm_upper_limits:
      [2.792526803, 1.308996939, 1.483529864,
       2.879793266, 1.483529864, 2.705260341]
    # Conservative values inferred from the current electrical-control code.
    # Replace them with the electrical team's measured joint-side limits.
    arm_max_velocities: [0.42, 0.50, 0.50, 1.31, 1.50, 1.50]
    arm_max_accelerations: [0.75, 0.75, 0.75, 0.75, 0.75, 0.75]

    # The two prismatic simulation joints are converted to one physical
    # gripper clear-opening command; they are never encoded as motor angles.
    gripper_joint_names: ["left_finger_joint", "right_finger_joint"]
    gripper_lower_limits: [0.0, -0.056]
    gripper_upper_limits: [0.056, 0.0]
    gripper_finger_thickness_m: 0.012
    # One physical motor mechanically couples the two simulated jaws. Reject
    # targets whose left/right center positions are not equal and opposite.
    gripper_coupling_tolerance_m: 0.0005
    gripper_max_opening_mm: 100
