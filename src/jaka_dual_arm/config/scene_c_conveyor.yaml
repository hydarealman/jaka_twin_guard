# 场景 C: 传送带分拣 — 从传送带抓取→放入料框
# 注意: 关节目标为估算值，传送带高位(z=0.42)抓取需实际运行微调

world_frame: "world"
label: "C: Conveyor-to-Bin Sortation"

cargo:
  size: { x: 0.15, y: 0.15, z: 0.10 }
  mass: 0.5
  initial_pose: { x: 0.0, y: 0.30, z: 0.42 }

table:
  enabled: false

bin:
  enabled: true
  center: { x: 0.55, y: -0.45, z: 0.30 }
  size: { x: 0.20, y: 0.20, z: 0.15 }
  wall_thickness: 0.005

conveyor:
  enabled: true
  start: { x: -0.50, y: 0.30, z: 0.40 }
  end:   { x: 0.60, y: 0.30, z: 0.40 }
  belt_width: 0.30
  speed: 0.05

# 6 阶段（估算值）
# cargo(0.0, 0.30, z=0.42): 双臂从Y两侧同步接近传送带高位
targets:
  approach:
    left:  [ 1.570, 0.900, -1.800, 0.900, 2.000, 0.000]
    right: [ 0.300, 0.900, -1.800, 0.900, -0.200, 0.000]
  grasp:
    left:  [ 1.570, 0.850, -1.700, 0.850, 2.300, 0.000]
    right: [ 0.300, 0.850, -1.700, 0.850, -0.200, 0.000]
  lift:
    left:  [ 1.200, 1.000, -1.900, 0.900, 2.500, 0.000]
    right: [ 0.300, 1.000, -1.900, 0.900, 0.200, 0.000]
  carry:
    left:  [ 0.800, 1.300, -1.600, 0.300, 2.700, 0.000]
    right: [-0.100, 1.300, -1.600, 0.300, 0.100, 0.000]
  release:
    left:  [-0.500, 1.200, -1.200, 0.000, 2.800, 0.000]
    right: [ 0.200, 1.200, -1.200, 0.000, -0.100, 0.000]
  retreat:
    left:  [-0.500, 0.850, -1.000, 0.150, 2.500, 0.000]
    right: [ 0.300, 0.850, -1.000, 0.150, -0.300, 0.000]
