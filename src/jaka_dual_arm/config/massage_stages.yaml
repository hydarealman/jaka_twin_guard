  # ═══════════════════════════════════════════════════════════════
  # Phase 1: 推法开背热身 (8 stages)
  # 从颈到骶逐区双侧按压，激活肌肉 — 用 press 确保 from-above 方式规划成功
  # ═══════════════════════════════════════════════════════════════
  - id: 1
    phase: 1
    name: "推法热身·C7双侧按压"
    left:  { zone: "C7",       position: "L", technique: "press" }
    right: { zone: "C7",       position: "R", technique: "press" }
  - id: 2
    phase: 1
    name: "推法热身·肩区双侧按压"
    left:  { zone: "shoulder", position: "L", technique: "press" }
    right: { zone: "shoulder", position: "R", technique: "press" }
  - id: 3
