# 60式中医推拿编排 — 8阶段 医疗推拿风格
#
# 手法参考: 中医推拿学 (第10版) 推拿八法
# 防碰撞策略:
#   同区双臂: left=L position (y≈-0.08m), right=R position (y≈+0.08m), Y向分离≥0.16m
#   穴位双臂: 同穴双侧, y=±0.04m (acupoint_y_offset), 同x无冲突
#   顺序执行: left先规划执行, right规划时MoveIt感知left当前/joint_states
#
# Phase 1: 推法开背热身  (8  stages) — 双臂逐区按压，顺序覆盖C7→骶骨
# Phase 2: 肩颈松解      (8  stages) — C7/肩区重点按揉，斜方肌/菱形肌
# Phase 3: 全背逐区按揉  (10 stages) — T1→L5双侧系统覆盖
# Phase 4: 膀胱经点穴    (14 stages) — BL11→BL25七穴两遍(轻→重)
# Phase 5: 腰骶深度按压  (6  stages) — 肾俞/命门/八髎深压
# Phase 6: 全背揉法放热  (6  stages) — 双侧按揉，疏通经络
# Phase 7: 振法颤动放松  (4  stages) — 高频振动松解肌筋膜
# Phase 8: 推法收功      (4  stages) — 轻力按压，收气结束
#
# 可用 technique (来自 TECHNIQUE_CONFIG):
#   驻点: hover / press / deep_press / release / vibrate
#   圆周: knead_L / knead_R
#   (多点路径 rub/scrub/roll 已停用: Cartesian规划失败时退化为随机跳跃=抽风)
#   离散: tap / strike

