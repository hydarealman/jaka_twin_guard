# 60式中医推拿编排 — 8阶段13手法
# 左臂→中线(C)+左侧(L)  右臂→中线(C)+右侧(R)  不跨中线
# 双臂永不同X区(ΔX≥0.15m防碰撞)
#
# Phase 1: 推法 (6 stages) — 全中线热身
# Phase 2: 按揉法 (10 stages) — 深层组织三线交替
# Phase 3: 点穴法 (14 stages) — 膀胱经7穴逐穴点按
# Phase 4: 摩法 (6 stages) — 圆周揉摩
# Phase 5: 擦法 (6 stages) — 直线推擦
# Phase 6: 滚揉法 (6 stages) — 肌肉松解滚动
# Phase 7: 振法 (6 stages) — 快速颤动放松
# Phase 8: 击法+收功 (6 stages) — 轻力敲击冷却收功
#
# 每阶段格式:
#   stage_id: {
#     name: "阶段名",
#     left:  { zone: "zone_name", position: "C/L/R", technique: "technique_name" }
#     right: { zone: "zone_name", position: "C/L/R", technique: "technique_name" }
#   }
# 或穴位模式:
#   left:  { acupoint: 0, technique: "press" }   # idx=0→BL11大杼

stages:
  # ═══ Phase 1: 推法 Gliding — 沿脊柱中线推扫热身 ═══
