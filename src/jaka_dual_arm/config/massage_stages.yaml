# 70式中医推拿编排 — 7阶段 全背全覆盖推拿方案
#
# 设计原则:
#   1. 全背覆盖: 7个背部区域 (C7→shoulder→upper→mid→lower_th→lumbar→sacrum)
#                × 3个横向位置 (L=左侧, C=脊柱中线, R=右侧) → 21个按压点网格
#   2. 每区必按: 每个区域至少经过 press→knead→deep_press→vibrate→press 完整流程
#   3. 速度保守: 仅使用 stationary (press/vibrate) 和 circle (knead) 原语
#                禁用 oscillate/sinusoid 多点路径 (Cartesian规划失败=抽风)
#   4. 过渡平缓: 每次单臂操作，另一臂保持上阶段位置 (MoveIt自动感知/joint_states)
#   5. 先L后...: left→right 按照 L→C→R 顺序横向覆盖
#
# 手法参考: 中医推拿学 (第10版) 推拿八法
# 防碰撞策略:
#   同区双臂: left=L position (y≈-0.08m), right=R position (y≈+0.08m), Y向分离≥0.16m
#   穴位双臂: 同穴双侧, y=±0.04m (acupoint_y_offset), 同x无冲突
#   顺序执行: left先规划执行, right规划时MoveIt感知left当前/joint_states
#
# 可用 technique (来自 TECHNIQUE_CONFIG):
#   驻点: hover / press / deep_press / release / vibrate
#   圆周: knead_L / knead_R
#   离散: tap / strike

