  # ═══════════════════════════════════════════════════════════════
  # Phase 1: 揉法 (7 stages) — C7/sacrum交叉, 其余正常
  # ═══════════════════════════════════════════════════════════════
  - id: 1
    phase: 1
    name: "揉法·C7(交叉)"
    left:  { zone: "C7",       position: "R", technique: "knead_wL" }
    right: { zone: "C7",       position: "L", technique: "knead_wR" }
  - id: 2
    phase: 1
