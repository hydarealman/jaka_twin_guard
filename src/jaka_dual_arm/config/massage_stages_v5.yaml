    left:  { zone: "lower_th", position: "L", technique: "knead_wL" }
    right: { zone: "lower_th", position: "R", technique: "knead_wR" }
  - id: 6
    phase: 1
    name: "揉法·腰区"
    left:  { zone: "lumbar",   position: "L", technique: "knead_wL" }
    right: { zone: "lumbar",   position: "R", technique: "knead_wR" }
  - id: 7
