# v5.0 双臂同步推拿编排 — 47 stage, 左半背+右半背同步
#
# 设计原则:
#   1. 双臂间距1.5m (y=±0.75)，臂体永不交叉
#   2. 端点区(C7/sacrum)交叉换边 (左→右半背, 右→左半背)，避免头/腿干扰
#   3. 中段区正常 (左→左半背, 右→右半背)
#   4. Phase 6 使用全新波浪手法
#   5. 全部同步双臂，无等待
#
# 注意:
#   - 本文件为 v5.0 参考方案，当前工业版仍使用 massage_stages.yaml (70 stage)
#   - 待 demo 验证通过后替换激活
#
# 可用 technique:
#   knead_L / knead_R (揉法圆周)
#   knead_wL / knead_wR (大揉搓, 需 path_generator 支持)
#   tap (拍法)
#   press / deep_press
#   pound (捶打)
#   arc_L / arc_R (弧扫)
#   wave (波浪, v5.0 新增)
#   vibrate (振法)

