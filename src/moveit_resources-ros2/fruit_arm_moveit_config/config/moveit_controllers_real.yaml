# Physical-robot controller map. Simulation intentionally keeps using
# moveit_controllers.yaml and its existing combined FollowJointTrajectory path.

trajectory_execution:
  # MoveIt starts this timer before the serial bridge has uploaded the
  # trajectory. Architecture A sends every point with an ACK, then waits up
  # to trajectory_duration + 10 s for the C-board MOTION_DONE result. Keep
  # monitoring enabled, but budget the bounded 500-point/115200-baud upload.
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 15.0
  allowed_start_tolerance: 0.01
  execution_duration_monitoring: true

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

  gripper_controller:
    action_ns: gripper_cmd
    type: GripperCommand
    default: true
    # The physical gripper has one binary actuator.  The right display joint
    # is the opposing kinematic estimate, not a second command channel.
    command_joint: left_finger_joint
    joints:
      - left_finger_joint
      - right_finger_joint
