# Planning soft limits. Each arm joint stays 5 degrees away from the measured
# mechanical hard stop in fruit_arm_macro.xacro.
# Time-optimal parameterization (Ruckig) requires BOTH velocity AND acceleration limits

default_velocity_scaling_factor: 0.5
default_acceleration_scaling_factor: 0.5

joint_limits:
  joint_1:
    has_position_limits: true
    # Keep a deliberate 5 degree command margin inside the J1 +/-120 degree
    # mechanical range.
    min_position: -2.007128639
    max_position: 2.007128639
    has_velocity_limits: true
    # Coordinated with the 30% production scaling: 1.40 * 0.30 = 0.42
    # rad/s, below the serial acceptance envelope and firmware hard clamp.
    max_velocity: 1.40
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint_2:
