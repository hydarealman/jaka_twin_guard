# 按摩右臂初始位置 — 悬停于按摩区域上方，避免碰撞床垫
# 床横放(长沿X)，床垫顶z=0.14，人体表面z≈0.17~0.20
# j2/j3抬高以避开床垫碰撞 (Start state must be collision-free)
# 按摩右臂初始位置 — 匹配107式第1阶段(sacrum R hover)，消除启动抽风+碰撞
# 床横放(长沿X)，床垫顶z=0.14，人体表面z≈0.17~0.20
# 右臂指向前方sacrum右侧(y=+0.12, x=0.84)，与左臂(C7 L press)空间分离
# hover偏移使末端悬停于身体上方，不接触皮肤
initial_positions:
  joint_1: -1.14
  joint_2: 0.75
  joint_3: -1.10
  joint_4: 1.30
  joint_5: 1.57
  joint_6: 1.50
