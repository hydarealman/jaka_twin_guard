# Scene Parameters — Table, bin, and object definitions
# All dimensions in meters, world frame.

world_frame: "world"

# ── Table ──
table:
  center: {x: 0.70, y: 0.0}
  top_z: 0.30
  size: {x: 0.75, y: 0.70, z: 0.04}
  leg_size: 0.04
  leg_height: 0.26   # top_z - size.z

# ── Bin ──
bin:
  center: {x: 0.55, y: 0.45}
  top_z: 0.30
  size: {x: 0.20, y: 0.20, z: 0.15}
  wall_thickness: 0.01

# ── Objects (fruits) ──
# Each object has:
#   id          — unique collision object ID
#   shape       — "sphere" | "box" | "cylinder" | "mesh"
#   position    — {x, y} on table surface (z = table_top_z + radius for spheres)
#   radius      — for sphere shape
#   color       — [r, g, b, a] for RViz visualization
#   label       — human-readable name
objects:
  - id: "fruit_apple"
    shape: "sphere"
    position: {x: 0.50, y: -0.20}
    radius: 0.035
    color: [1.0, 0.15, 0.15, 0.9]
    label: "Apple"

  - id: "fruit_orange"
    shape: "sphere"
    position: {x: 0.55, y: -0.05}
    radius: 0.040
    color: [1.0, 0.55, 0.05, 0.9]
    label: "Orange"

  - id: "fruit_plum"
    shape: "sphere"
    position: {x: 0.40, y: 0.15}
    radius: 0.030
    color: [0.60, 0.15, 0.60, 0.9]
    label: "Plum"

  - id: "fruit_lime"
    shape: "sphere"
    position: {x: 0.72, y: -0.20}
    radius: 0.028
    color: [0.15, 0.80, 0.20, 0.9]
    label: "Lime"

# ── Home pose (joint angles in radians) ──
home_pose: [0.0, 1.50, -1.50, 1.50, 1.57, 0.0]
