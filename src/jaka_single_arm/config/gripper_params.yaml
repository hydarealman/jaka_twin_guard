# Gripper Parameters — Parallel-jaw gripper control

# Gripper type
type: "parallel_jaw"

# Joint names
joints: ["left_finger_joint", "right_finger_joint"]

# Preset positions (meters for prismatic joints)
open: [0.055, -0.055]       # fully open; clears the largest 80mm fruit
closed: [0.005, -0.005]     # nearly closed (leave 2mm gap to avoid collision)
finger_thickness: 0.012     # collision width along the closing axis
grasp_clearance: -0.001     # 1mm preload per finger before the grasp constraint

# Gripper force/velocity limits
max_velocity: 0.2            # m/s
max_effort: 50.0             # N

# Time to complete open/close (seconds)
travel_time: 1.0
