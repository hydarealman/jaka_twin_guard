/camera/camera:
  ros__parameters:
    # D455 RGB-D baseline for fruit localisation.  The launch file can override
    # Select the connected D455 automatically. Set a fixed serial only when
    # several RealSense cameras are connected.
    serial_no: ""
    initial_reset: false
    reconnect_timeout: 6.0          # 设备断连后,驱动尝试重新连接的时间
    wait_for_device_timeout: 10.0   # 启动时等待d455出现的最长时间

    enable_color: true              # 彩色图像
    # 424x240x15 is the stable RGB-D profile on the current WSL2/usbipd path.
    # Native Linux/USB3 can be overridden to 640,480,15 when that profile is
    # measured stable on the target computer.
    rgb_camera.color_profile: "424,240,15"       # 宽度 高度 帧率
    rgb_camera.color_format: "RGB8"              # 8位RGB彩色格式,每个像素3个通道
    rgb_camera.enable_auto_exposure: true        # 自动曝光
    rgb_camera.enable_auto_white_balance: true   # 自动白平衡
    # Mainland China mains frequency.  Fixed 50 Hz is more deterministic than Auto.
    rgb_camera.power_line_frequency: 1           # 设置电源频闪抑制频率50hz 适合中国大陆的交流电环境
    rgb_camera.auto_exposure_priority: false     # 关闭自动曝光优先

    enable_depth: true                           # 开启深度流
    depth_module.depth_profile: "424,240,15"
    depth_module.depth_format: "Z16"             # 16位深度格式
    # D455 Default preset, depth auto-exposure, emitter enabled, laser power
    # 150 and HDR disabled. These are explicit so native Ubuntu and WSL use
    # the same measured baseline.
    depth_module.visual_preset: 1
    depth_module.emitter_enabled: 1
    depth_module.laser_power: 150.0
    depth_module.hdr_enabled: false

    enable_infra: false
    enable_infra1: false
    enable_infra2: false
    enable_gyro: false
    enable_accel: false
    enable_motion: false

    enable_sync: true                           # 让RGB和深度帧尽量使用同一时刻的数据
    align_depth.enable: true                    # 把深度图对齐到彩色相机坐标系
    pointcloud.enable: true                     # 开启点云生成
    pointcloud.stream_filter: 2
    pointcloud.stream_index_filter: 0
    pointcloud.ordered_pc: false
    pointcloud.allow_no_texture_points: false

    # Spatial + temporal filtering reduced median temporal depth deviation in
    # the measured scene from 6.5 mm to 3.5 mm.  Hole filling stays disabled so
    # the grasp stack does not mistake invented pixels for measured surfaces.
    spatial_filter.enable: true
    spatial_filter.filter_magnitude: 2
    spatial_filter.filter_smooth_alpha: 0.5
    spatial_filter.filter_smooth_delta: 20
    spatial_filter.holes_fill: 0
    # Disabled by the launch default for moving fruit. Enable explicitly for
    # static-scene depth inspection when temporal smoothing is desired.
    temporal_filter.enable: false
    temporal_filter.filter_smooth_alpha: 0.4
    temporal_filter.filter_smooth_delta: 20
    # Temporal filtering uses history and can trail a moving apple. Never
    # persistently fill holes in the grasp path.
    temporal_filter.holes_fill: 0
    hole_filling_filter.enable: false
    decimation_filter.enable: false

    color_qos: "SENSOR_DATA"
    depth_qos: "SENSOR_DATA"
    pointcloud.pointcloud_qos: "SENSOR_DATA"
    diagnostics_period: 1.0
    publish_tf: true
    tf_publish_rate: 0.0
