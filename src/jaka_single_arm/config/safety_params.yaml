# Safety Parameters — ISO 10218-1 inspired safety monitoring
# Limits for the proprietary fruit-picking arm.

# ── Joint position limits (radians, per joint_1..joint_6) ──
joint_limits:
  # URDF joints are re-zeroed to the mechanical reference lines. J2 positive
  # is clockwise when viewed along +Y, hence CCW60/CW80 = [-60,+80] deg.
  lower: [-2.879793266, -1.047197551, -1.570796327,
          -2.967059728, -1.570796327, -2.792526803]
  upper: [ 2.879793266,  1.396263402,  1.570796327,
           2.967059728,  1.570796327,  2.792526803]
  # Runtime protective boundary: 5 degrees before every mechanical hard stop.
  margin: 0.087266463

# ── Joint velocity limits (rad/s) ──
joint_velocity:
  max_velocity: 2.0       # fastest simulated CAD-arm joint
  warn_scaling: 0.85      # warn at 85% of max
  halt_scaling: 0.95      # halt at 95% of max

# ── Force/Torque limits ──
force_torque:
  max_force: 80.0         # N (end-effector)
  max_torque: 30.0        # Nm
  warning_ratio: 0.80     # warn at 80% of max

# ── Workspace boundary (world frame, meters) ──
workspace:
  radius: 1.0             # cylindrical radius from base
  z_min: -0.10
  z_max: 1.10             # includes the validated 1.028m parking TCP

# ── Communication timeouts (seconds) ──
timeouts:
  joint_state: 30.0        # Full BT tick blocks ~13s (sync executor); need margin
  controller: 2.0          # max controller response time

# ── Logging ──
log_suppression_sec: 2.0   # suppress repeated warnings within this window
