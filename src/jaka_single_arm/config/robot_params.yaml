# Robot Parameters — single-arm pick-and-place
#
# ROBOT MODEL SWAPPING:
#   To use a different robot (UR5e, Kinova, Fanuc, etc.), change:
#     description_package — package containing URDF/SRDF/configs
#     description_file    — path to URDF/xacro relative to package share
#     srdf_file           — path to SRDF relative to package share
#   Then update arm_joints, gripper_joints, planning_group, ik_link
#   to match the new robot's kinematics.
#
# Joint configuration
arm_joints: ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6"]
gripper_joints: ["left_finger_joint", "right_finger_joint"]
all_joints: ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6",
             "left_finger_joint", "right_finger_joint"]

# Planning groups (matches SRDF)
planning_group: "arm"
gripper_group: "gripper"
full_group: "arm_with_gripper"

# End effector
ik_link: "tool_flange"
end_effector: "gripper_ee"
end_effector_parent: "tool_flange"

# Controller action names
arm_controller_action: "/arm_controller/follow_joint_trajectory"

# Robot base pose in world frame
base_pose:
  position: {x: 0.0, y: 0.0, z: 0.0}
  orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
