# Perception Parameters — Camera abstraction & object detection

# Camera type: "mock" | "gazebo" | "realsense"
camera_type: "mock"

# Camera frame in TF tree
camera_frame: "camera_depth_frame"

# Output topics (standardized, independent of camera type)
point_cloud_topic: "/perception/point_cloud"
depth_image_topic: "/perception/depth_image"
rgb_image_topic: "/perception/rgb_image"

# ── Object Detection Parameters ──

# Voxel grid leaf size for downsampling (m)
voxel_leaf_size: 0.005

# RANSAC plane segmentation
ransac_distance_threshold: 0.008   # tighter for better plane fit
ransac_max_iterations: 200         # more iterations = better plane model

# Euclidean cluster extraction
cluster_tolerance: 0.015           # tighter to separate close objects (was 0.02)
min_cluster_size: 50               # lower to catch small fruits (was 100)
max_cluster_size: 5000             # per-cluster cap (was 10000)

# Known table height for Z-filter fallback (when RANSAC fails)
table_top_z: 0.30
table_z_tolerance: 0.02

# Minimum confidence for a detection (0.0–1.0)
min_confidence: 0.5

# ── Mock Camera Parameters ──
mock_camera:
  publish_rate: 10.0
  table_points: 2000
  points_per_object: 400
  noise_std: 0.003   # 3mm Gaussian noise
  camera_z: 0.86     # height of camera above ground

# ── Gazebo Camera Parameters ──
gazebo_camera:
  depth_topic: "/camera/depth/points"
  depth_image_topic: "/camera/depth/image_raw"
  color_image_topic: "/camera/color/image_raw"

# ── RealSense Camera Parameters ──
realsense_camera:
  depth_topic: "/camera/camera/depth/color/points"
  depth_image_topic: "/camera/camera/depth/image_rect_raw"
  color_image_topic: "/camera/camera/color/image_raw"

# ── 苹果好坏识别（YOLOv8，移植自 ros2IdentifyApple）──
# fruit_detector_node 用此配置；HealthFusion 用 detections_topic / camera_info_topic。
classifier:
  enabled: true
  backend: "onnxruntime"        # "onnxruntime"(默认,轻) | "ultralytics"(需 torch)
  # 模型路径留空则自动用 share/jaka_single_arm/models/ 下的文件
  model_onnx: ""
  model_pt: ""
  data_yaml: ""
  conf: 0.25                    # 置信度阈值（队友 README 用 0.15，可调低以适配仿真贴图）
  nms: 0.45                     # NMS IoU 阈值
  image_topic: "/camera/color/image_raw"
  camera_info_topic: "/camera/color/camera_info"
  detections_topic: "/perception/fruit_detections"
  annotated_topic: "/perception/health_annotated"
  pixel_match_tolerance: 80.0   # 3D 质心投影到像素后与检测框中心的最大匹配距离(px)
